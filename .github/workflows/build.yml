name: Build OpenWrt IPK Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build luci-app-sshws
    runs-on: ubuntu-22.04

    env:
      SDK_URL: "https://downloads.openwrt.org/releases/23.05.3/targets/x86/64/openwrt-sdk-23.05.3-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz"
      SDK_FILE: "openwrt-sdk.tar.xz"
      APP_NAME: "luci-app-sshws"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk gcc-multilib gettext git libncurses-dev python3-distutils unzip zlib1g-dev wget file

      - name: Download and Extract OpenWrt SDK
        run: |
          wget -q -O ${{ env.SDK_FILE }} ${{ env.SDK_URL }}
          mkdir openwrt-sdk
          tar -xJf ${{ env.SDK_FILE }} -C openwrt-sdk --strip-components=1

      - name: Prepare Package Directory
        run: |
          mkdir -p openwrt-sdk/package/luci-app-sshws
          cp -R Makefile root www openwrt-sdk/package/luci-app-sshws/

      - name: Update and Install LUCI Feed ONLY
        working-directory: openwrt-sdk
        run: |
          # Hanya mengambil modul base dan luci, JANGAN install -a
          ./scripts/feeds update base luci
          ./scripts/feeds install -p luci -a

      - name: Build The IPK Package
        working-directory: openwrt-sdk
        run: |
          # Hapus sisa konfigurasi lama
          rm -f .config
          # Buat konfigurasi default
          make defconfig
          # Aktifkan aplikasi kita di konfigurasi
          echo "CONFIG_PACKAGE_luci-app-sshws=m" >> .config
          # Compile HANYA aplikasi kita saja
          make package/luci-app-sshws/compile V=s IGNORE_ERRORS=m

      - name: Locate Output IPK
        run: |
          IPK_PATH=$(find openwrt-sdk/bin/packages/ -name "${{ env.APP_NAME }}_*.ipk" | head -n 1)
          if [ -z "$IPK_PATH" ]; then
            echo "ERROR: File IPK tidak ditemukan!"
            exit 1
          fi
          echo "Found IPK: $IPK_PATH"
          cp "$IPK_PATH" ./output.ipk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-ipk
          path: ./output.ipk